name: CI / Déploiement GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permet de relancer un déploiement à la main depuis l'onglet Actions.
  workflow_dispatch:

# Un seul déploiement à la fois ; on ne coupe pas celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Nu Html Checker (le validateur du W3C) : conformité HTML réelle,
      # hiérarchie des titres, attributs ARIA, etc.
      - name: Validation HTML
        uses: Cyb3r-Jak3/html5validator-action@v8.0.0
        with:
          root: .
          css: true
          log_level: INFO

      # lychee vérifie les liens internes *et* externes, ainsi que les ancres.
      # --base résout les chemins commençant par « / » depuis la racine du dépôt.
      - name: Liens et ancres
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --base .
            --include-fragments
            --no-progress
            --max-retries 3
            --accept 200,206,403,429
            './**/*.html'
          fail: true

  deploy:
    name: Déploiement
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/configure-pages@v6.0.0

      - name: Préparer l'artefact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
